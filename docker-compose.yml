services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: football_ai
      POSTGRES_USER: football_ai
      POSTGRES_PASSWORD: football_ai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U football_ai -d football_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://football_ai:football_ai@postgres:5432/football_ai
      APP_ENV: ${APP_ENV:-development}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-change-me-in-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-in-production}
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      SPORTMONKS_API_TOKEN: ${SPORTMONKS_API_TOKEN:-}
      FOOTBALL_PROVIDER: ${FOOTBALL_PROVIDER:-sportmonks}
      SPORTMONKS_BASE_URL: ${SPORTMONKS_BASE_URL:-https://api.sportmonks.com/v3/football}
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-15}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-1000000}
      JOB_RETRY_BASE_SECONDS: ${JOB_RETRY_BASE_SECONDS:-60}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://football_ai:football_ai@postgres:5432/football_ai
      APP_ENV: ${APP_ENV:-development}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-change-me-in-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-in-production}
      SPORTMONKS_API_TOKEN: ${SPORTMONKS_API_TOKEN:-}
      FOOTBALL_PROVIDER: ${FOOTBALL_PROVIDER:-sportmonks}
      SPORTMONKS_BASE_URL: ${SPORTMONKS_BASE_URL:-https://api.sportmonks.com/v3/football}
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-15}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-}
      SCHEDULER_SYNC_INTERVAL_SECONDS: ${SCHEDULER_SYNC_INTERVAL_SECONDS:-21600}
      SCHEDULER_DISPATCH_INTERVAL_SECONDS: ${SCHEDULER_DISPATCH_INTERVAL_SECONDS:-60}
      JOB_RETRY_BASE_SECONDS: ${JOB_RETRY_BASE_SECONDS:-60}
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  postgres_data:
